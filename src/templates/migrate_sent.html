{% extends "base.html" %}
{% block title %}Check your email - F1 Predictor{% endblock %}
{% block content %}
<section class="panel centered">
  <div class="phead"><h2>Link Sent</h2><span class="tag pos">Check your inbox</span><div class="rule"></div></div>
  <div class="pbody">
    <p>A one-time link is on its way to <strong style="color:var(--tx)">{{ email }}</strong>. Click it to tie your picks to that address.</p>
    <p class="lbl" style="margin-top:14px">Expires in 15 minutes · single use</p>
    <div class="btnrow" style="margin-top:20px"><a href="{{ url_for('home') }}" class="btn btn-secondary"><span>Back to desk</span></a></div>
  </div>
</section>
{% endblock %}
