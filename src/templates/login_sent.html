{% extends "base.html" %}
{% block title %}Check your email - F1 Predictor{% endblock %}
{% block content %}
<section class="panel centered">
  <div class="phead"><h2>Link Sent</h2><span class="tag pos">Check your inbox</span><div class="rule"></div></div>
  <div class="pbody">
    <p>If <strong style="color:var(--tx)">{{ email }}</strong> is a real address, a one-time login link is on its way. Check spam if it's slow.</p>
    <p class="lbl" style="margin-top:14px">Expires in 15 minutes · single use</p>
    <div class="btnrow" style="margin-top:20px"><a href="{{ url_for('index') }}" class="btn btn-secondary"><span>Back</span></a></div>
  </div>
</section>
{% endblock %}
