{% extends "base.html" %}

{% block title %}Login - F1 Predictor{% endblock %}

{% block content %}
<div class="card" style="text-align: center; margin-top: 50px;">
    <h1 style="font-size: 48px; margin-bottom: 10px;">✉️</h1>
    <h1>Log in with email</h1>
    <p style="font-size: 18px; margin: 30px 0;">
        Enter your email address and we'll send you a magic link to log in. No password needed.
    </p>

    <form method="POST" action="{{ url_for('login_request') }}" style="max-width: 400px; margin: 0 auto;">
        <input type="email" name="email" placeholder="you@example.com" required autofocus>
        <button type="submit" class="btn" style="width: 100%;">Send Magic Link</button>
    </form>

    <p style="margin-top: 30px; opacity: 0.6; font-size: 14px;">
        Prefer to stay anonymous? <a href="{{ url_for('index') }}" style="color: #fff; text-decoration: underline;">Enter a username instead</a>.
    </p>
</div>
{% endblock %}
